name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PY: python
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # the Colab version; the Mac runs 3.14
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/ledgar/config.py') }}
      - name: Install (CPU torch first, then the pinned package)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Smoke run (FAST_RUN=1) and notebooks
        run: make smoke
