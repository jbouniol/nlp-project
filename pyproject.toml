[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgar"
version = "0.1.0"
description = "Contract-clause classifier on LEDGAR (LexGLUE): TF-IDF baseline, LSTM, DistilBERT and LoRA."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Same pins as requirements.txt (the course environment).
dependencies = [
    "torch==2.14.1",
    "transformers==5.19.0",
    "datasets==5.1.0",
    "huggingface-hub==1.33.0",
    "accelerate==1.15.0",
    "peft==0.21.2",
    "scikit-learn==1.9.1",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "matplotlib==3.11.2",
    "scipy==1.18.1",
    "sentence-transformers==6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "ipykernel==7.4.0",
    "nbconvert==7.17.2",
    "nbformat==5.11.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: downloads LEDGAR or a pretrained model (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]
